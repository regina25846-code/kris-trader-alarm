<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kris Trader Alarm</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #1a1d27; color: #d1d4dc; font-family: sans-serif; font-size: 15px; }
    p { margin: 8px 0; }
    a { color: #26a69a; }
  </style>
</head>
<body>
  <p>앱으로 연결 중...</p>
  <p id="fallback" style="display:none;font-size:13px;color:#888;">
    앱이 열리지 않으면 <a id="weblink" href="#">여기</a>를 눌러주세요.
  </p>
  <script>
    const p = new URLSearchParams(location.search);
    const ex = p.get('e');
    const code = p.get('code');
    const sym = p.get('sym');

    let appUrl, webUrl;
    if (ex === 'bithumb') {
      webUrl = 'https://www.bithumb.com/react/trade/order/' + sym + '-KRW';
      appUrl = 'intent://#Intent;package=com.btckorea.bithumb;scheme=bithumb;S.browser_fallback_url=' + encodeURIComponent(webUrl) + ';end';
    } else {
      webUrl = 'https://upbit.com/exchange?code=CRIX.UPBIT.' + code;
      appUrl = 'intent://#Intent;package=com.dunamu.exchange;scheme=upbit;S.browser_fallback_url=' + encodeURIComponent(webUrl) + ';end';
    }

    document.getElementById('weblink').href = webUrl;

    let appOpened = false;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) appOpened = true;
    });

    window.location.href = appUrl;

    setTimeout(() => {
      if (!appOpened) {
        window.location.href = webUrl;
      }
    }, 1500);

    setTimeout(() => {
      document.getElementById('fallback').style.display = 'block';
    }, 2500);
  </script>
</body>
</html>
